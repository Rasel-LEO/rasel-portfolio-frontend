name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check repository files
        run: |
          for path in package.json package-lock.json README.md LICENSE CHANGELOG.md \
            vite.config.js playwright.config.js src/pages src/content tests tools; do
            test -e "$path" || { echo "Missing: $path"; exit 1; }
          done
          if git ls-files | grep -E '(^|/)\.env($|\.)|node_modules/|^dist/|^playwright-report/|^test-results/'; then
            echo "Forbidden files are tracked"; exit 1; fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit (development tooling, allow-list, FD-134)
        run: npm run check:audit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build (Django target, FD-133)
        run: npm run build:django

      - name: Check the Django build
        run: node tools/check-django-build.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lighthouse budgets (FD-129)
        run: npm run lhci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 7
